<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CJK 小字号渲染复现（评审证据）</title>
<style>
  body { margin: 0; background: #0b1220; color: #cbd5e1; font: 12px sans-serif; }
  .row { display: flex; gap: 8px; padding: 8px; }
  canvas { background: #0b1220; }
  h3 { margin: 4px 8px; font-size: 12px; color: #94a3b8; }
  p { margin: 0 8px 4px; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
<h3>T11 必修项 A：1.27mm 中文在 Canvas 上的重叠复现与修复验证</h3>
<p>左：视图 scale=4（默认）；右：视图 scale=8；两图均为 DPR=2 的真实 Chrome 截图。</p>
<div class="row">
<canvas id="c4" style="width:620px;height:560px"></canvas>
<canvas id="c8" style="width:620px;height:560px"></canvas>
</div>
<script type="module">
import { SchematicRenderer } from '../../src/render/renderer.js';
import { createText, createLabel, createSymbolInstance, createProject, createWire } from '../../src/model/project.js';
import { builtinSymbols } from '../../src/library/builtin-symbols.js';

const project = createProject('中文渲染复现');
const sheet = project.sheets[0];
project.library.symbols = builtinSymbols().slice(0, 6);
sheet.texts.push(createText({ x: 10, y: 10, text: '中文注释1.27mm：原理图编辑器', size: 1.27 }));
sheet.texts.push(createText({ x: 10, y: 20, text: '中文注释2.54mm：原理图编辑器', size: 2.54 }));
sheet.labels.push(createLabel({ x: 10, y: 30, text: '本地网络标签中文测试', kind: 'local' }));
sheet.labels.push(createLabel({ x: 10, y: 38, text: '全局网络标签中文测试', kind: 'global' }));
sheet.symbols.push(createSymbolInstance({ symbolId: 'R', designator: 'R1', value: '电阻值', x: 30, y: 50 }));
sheet.symbols.push(createSymbolInstance({ symbolId: 'GND', designator: '#PWR01', value: 'GND', x: 50, y: 50 }));
sheet.wires.push(createWire([{ x: 30, y: 44.92 }, { x: 50, y: 50 }]));
sheet.title = { title: '中文标题栏测试 1.27mm', company: '示例公司', rev: 'A', date: '2026-11-16', comments: '' };

function mount(id, scale) {
  const canvas = document.getElementById(id);
  const renderer = new SchematicRenderer(canvas, { labelSize: 1.27 });
  renderer.setState({ project, sheet });
  renderer.setView({ offsetX: 30, offsetY: 40, scale });
  renderer.render(true);
}
mount('c4', 4);
mount('c8', 8);
</script>
</body>
</html>
